<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presenze">
<title>Presenze Squadriglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- BENTORNATO -->
  <div id="view-welcome" class="hidden">
    <h1>🏕️ Bentornato!</h1>
    <p class="sub">Vuoi accedere con uno di questi account?</p>
    <div class="card" id="accounts-list"></div>
    <button class="btn-secondary" onclick="showView('view-login')">Accedi con un altro account</button>
  </div>

  <!-- LOGIN --
  <div id="view-login" class="hidden">
    <h1>🏕️ Presenze Squadriglia</h1>
    <p class="sub">Accedi con il tuo nome e il nome della tua squadriglia.</p>
    <div class="card">
      <label for="in-nome">Il tuo nome</label>
      <input type="text" id="in-nome" placeholder="es. Marco">
      <label for="in-squadriglia">Nome squadriglia</label>
      <input type="text" id="in-squadriglia" placeholder="es. Aquile">
      <button class="btn-primary" onclick="login()">Entra</button>
    </div>
  </div>

  <!-- ROSTER -->
  <div id="view-roster" class="hidden">
    <div class="nav">
      <div class="who">Squadriglia <b id="sq-nome-1"></b><br>Ciao, <b id="user-nome-1"></b></div>
      <button class="btn-text" onclick="logout()">Esci</button>
    </div>
    <div class="card">
      <label for="in-membro">Aggiungi persona alla squadriglia</label>
      <input type="text" id="in-membro" placeholder="Nome persona" onkeydown="if(event.key==='Enter')addMember()">
      <button class="btn-primary" onclick="addMember()">+ Aggiungi</button>
    </div>
    <div class="card"><div id="roster-list"></div></div>
    <div class="btn-row">
      <button class="btn-primary" onclick="goToPresenze()">📋 Presenze</button>
      <button class="btn-secondary" onclick="goToStorico()">🗓️ Storico</button>
    </div>
    <button class="btn-secondary" onclick="goToCalendario()">📅 Calendario Reparto</button>
  </div>

  <!-- PRESENZE -->
  <div id="view-presenze" class="hidden">
    <div class="nav">
      <div class="who">Squadriglia <b id="sq-nome-2"></b></div>
      <button class="btn-text" onclick="goToRoster()">← Lista</button>
    </div>
    <h1>Segna le presenze</h1>
    <div class="card">
      <label for="in-data">Data riunione</label>
      <input type="date" id="in-data">
    </div>
    <div class="card"><div id="presenze-list"></div></div>
    <button class="btn-primary" onclick="generaOutput()">Genera elenco e salva</button>
  </div>

  <!-- OUTPUT -->
  <div id="view-output" class="hidden">
    <div class="nav">
      <div class="who">Squadriglia <b id="sq-nome-3"></b></div>
      <button class="btn-text" id="output-back-btn">← Indietro</button>
    </div>
    <h1>Elenco presenze</h1>
    <div class="card">
      <textarea id="output-text" readonly></textarea>
      <button class="btn-primary" onclick="copyOutput()">📋 Copia testo</button>
      <button class="btn-secondary" onclick="goToRoster()">Torna alla lista</button>
    </div>
  </div>

  <!-- CALENDARIO REPARTO -->
  <div id="view-calendario" class="hidden">
    <div class="nav">
      <div class="who">Calendario del Reparto</div>
      <button class="btn-text" onclick="goToRoster()">← Lista</button>
    </div>
    <div class="card">
      <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?src=c_54e2bd11628630ba6020178da3e4a09cfeb431befece937f40e1e9e177bbce13%40group.calendar.google.com&amp;ctz=Europe%2FRome&amp;mode=AGENDA&amp;showTitle=0&amp;showNav=1&amp;showDate=1&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0" frameborder="0" scrolling="no"></iframe>
      <p class="cal-note">Calendario pubblico del Gruppo Scout Val d'Enza 1, filtrato sulla sola branca Reparto (Branca E/G).</p>
    </div>
  </div>

  <!-- STORICO -->
  <div id="view-storico" class="hidden">
    <div class="nav">
      <div class="who">Squadriglia <b id="sq-nome-4"></b></div>
      <button class="btn-text" onclick="goToRoster()">← Lista</button>
    </div>
    <h1>Storico riunioni</h1>
    <div class="card"><div id="storico-list"></div></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
